name: Debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # AGP installs the NDK named by ndkVersion in app/build.gradle; the
      # licences have to be accepted for that.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Show the shared libraries in the APK
        run: unzip -l app/build/outputs/apk/debug/app-debug.apk | grep liblibraw.so

      - uses: actions/upload-artifact@v4
        with:
          name: libraw-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
