plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tssystems.librawtest'
    compileSdk 35
    // The NDK the PhotoMate app is built with, so the library is compiled the same way.
    ndkVersion '29.0.13846066'

    defaultConfig {
        applicationId 'com.tssystems.librawtest'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.22.3'
        // Demo: arm64 is enough.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            // liblibraw.so comes from the buildLibraw task below.
            jniLibs.srcDir layout.buildDirectory.dir('ndkLibs')
            // com.tssystems.Libraw, the Java side of the JNI bridge, is the file
            // under java/ that belongs to the source offer; the sample uses it
            // as it is.
            java.srcDirs = ['src/main/java', '../java']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// AGP's own ndkBuild integration asks ndk-build for a target named "libraw"
// (it strips the "lib" of the module name liblibraw) and fails with "No rule to
// make target". ndk-build is therefore run directly, the way the PhotoMate app
// builds this module (pictureInfo/ndk/build-native.sh), and its output is
// packaged as jniLibs.
tasks.register('buildLibraw', Exec) {
    def jni = file('../jni')
    def libs = layout.buildDirectory.dir('ndkLibs').get().asFile
    def obj = layout.buildDirectory.dir('ndkObj').get().asFile
    inputs.dir(jni)
    outputs.dir(libs)
    doFirst {
        commandLine "${android.ndkDirectory}/ndk-build",
                "NDK_PROJECT_PATH=${jni.parentFile}",
                "APP_BUILD_SCRIPT=${jni}/Android.mk",
                "NDK_APPLICATION_MK=${jni}/Application.mk",
                "APP_ABI=arm64-v8a",
                "NDK_LIBS_OUT=${libs}",
                "NDK_OUT=${obj}",
                "-j${Runtime.runtime.availableProcessors()}"
    }
}

tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn 'buildLibraw'
}
